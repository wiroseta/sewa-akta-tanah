<!doctype html><html lang='id'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#f5f5f7'><title>Sewa & Akta Tanah</title><link rel='manifest' href='manifest.json'><link rel='stylesheet' href='style.css'></head><body><header><div><small>PROPERTY DOCUMENT MANAGER</small><h1>Sewa & Akta Tanah</h1></div><button id='addBtn'>＋ Tambah Data</button></header><main><section class='stats' id='stats'></section><section class='alert'><h2>Agenda & Peringatan</h2><div id='alerts'></div></section><section><div class='toolbar'><h2>Kontrak & Aset</h2><input id='search' placeholder='Cari penyewa, aset, nomor akta...'></div><div id='cards'></div></section></main><dialog id='dlg'><form id='form'><h2>Tambah / Edit Kontrak</h2><div class='grid'><label>Nama penyewa<input name='tenant' required></label><label>Nama aset/lokasi<input name='asset' required></label><label>No. akta<input name='deedNo'></label><label>Tanggal akta<input type='date' name='deedDate'></label><label>Mulai sewa<input type='date' name='start'></label><label>Berakhir sewa<input type='date' name='end'></label><label>Nilai sewa (Rp)<input type='number' name='rent'></label><label>Deadline pemberitahuan perpanjangan<input type='date' name='renewalNotice'></label><label>PIC Pihak Pertama<input name='pic1'></label><label>Telepon Pihak Pertama<input name='phone1'></label><label>PIC Penyewa<input name='pic2'></label><label>Telepon Penyewa<input name='phone2'></label><label>Bank pembayaran<input name='bank'></label><label>No. rekening<input name='account'></label><label>Nama rekening<input name='accountName'></label><label>No. HGB<input name='hgbNo'></label><label>HGB berakhir<input type='date' name='hgbEnd'></label><label>Link dokumen / Google Drive<input type='url' name='docUrl'></label></div><label>Poin penting<textarea name='notes' rows='5'></textarea></label><h3>Jadwal Pembayaran</h3><div id='payments'></div><button type='button' class='secondary' id='addPayment'>＋ Termin</button><div class='actions'><button type='button' class='secondary' id='cancel'>Batal</button><button type='submit'>Simpan</button></div></form></dialog><script src='app.js'></script></body></html>
